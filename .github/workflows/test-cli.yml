name: Test CLI

on:
  push:
    paths:
      - 'sinto-cli/**'
  pull_request:
    paths:
      - 'sinto-cli/**'
  workflow_dispatch: {}

jobs:
  test:
    name: CLI Vitest tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./sinto-cli
        run: npm ci

      - name: Run Vitest
        working-directory: ./sinto-cli
        env:
          CI: true
        run: |
          # Run vitest with coverage output; adapt script names if repo differs
          if npm run | grep -q "test"; then
            npm run test -- --coverage || npm test -- --coverage || true
          else
            npm test || true
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-coverage
          path: |
            ./sinto-cli/coverage
            ./sinto-cli/coverage/lcov.info

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sinto-cli/coverage/lcov.info
          verbose: true
