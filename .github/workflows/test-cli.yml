name: Test CLI

on:
  pull_request:
    paths:
      - 'sinto-cli/**'
  push:
    branches: [main]
    paths:
      - 'sinto-cli/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sinto-cli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sinto-cli/package-lock.json

      - run: npm ci

      - name: Run tests
        run: npm run test:coverage
