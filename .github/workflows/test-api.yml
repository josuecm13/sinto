name: Test API

on:
  push:
    paths:
      - 'sinto-api/**'
  pull_request:
    paths:
      - 'sinto-api/**'
  workflow_dispatch: {}

jobs:
  test:
    name: API tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [16, 18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        working-directory: ./sinto-api
        run: |
          npm ci

      - name: Start Docker test containers (if present)
        run: |
          if [ -f ./sinto-api/docker-compose.test.yml ]; then docker compose -f ./sinto-api/docker-compose.test.yml up -d; fi

      - name: Run tests
        working-directory: ./sinto-api
        env:
          CI: true
        run: |
          # Try to run a coverage-capable test command. Adjust in repository if needed.
          if npm run | grep -q "test"; then
            npm run test -- --coverage --ci || npm test -- --coverage --ci || true
          else
            npm test || true
          fi

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: |
            ./sinto-api/coverage
            ./sinto-api/coverage/lcov.info

      - name: Upload coverage to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./sinto-api/coverage/lcov.info
          verbose: true
