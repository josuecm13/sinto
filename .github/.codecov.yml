coverage:
  status:
    project:
      default:
        target: 80%
    patch:
      default:
        target: 80%
  precision: 2
  range: "70...100"
  ignore:
    - "docs/*"
    - "tests/*"
comment: off
upload:
  max_retries: 3
  max_reports: 5
  retries: 3
# Notes: Place Codecov token in CI as CODECOV_TOKEN when using private repos.