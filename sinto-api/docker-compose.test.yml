version: '3.9'

# Test-only containers — isolated ports to avoid conflicts with dev stack.
# Usage: docker compose -f docker-compose.test.yml up -d

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: sinto_postgres_test
    environment:
      POSTGRES_USER: sinto_test
      POSTGRES_PASSWORD: sinto_test_pass
      POSTGRES_DB: sinto_test_db
    ports:
      - '5434:5432'
    tmpfs:
      - /var/lib/postgresql/data  # RAM-backed for speed
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sinto_test -d sinto_test_db']
      interval: 3s
      timeout: 3s
      retries: 10

  redis-test:
    image: redis:7-alpine
    container_name: sinto_redis_test
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 10
